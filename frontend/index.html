<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Keep legacy query-based action tokens out of same-origin asset logs and
         third-party font requests, including PWA navigation fallbacks. -->
    <meta name="referrer" content="no-referrer" />

    <!-- PWA 基础 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- 视口 & 移动端优化 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinArch" />

    <!-- 主题色 (Edge / Chrome 地址栏) -->
    <meta name="theme-color" content="#F3F6F2" />
    <meta name="msapplication-TileColor" content="#17201D" />

    <!-- SEO / 描述 -->
    <meta name="description" content="记账 · 报销 · 统计，轻量高效的多用户财务管理工具" />
    <meta name="application-name" content="FinArch" />

    <!-- 禁止自动识别电话号码 -->
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS Apple Splash Screens -->
    <!-- iPhone 14 Pro / 15 Pro (393pt @3x = 1179×2556) -->
    <link rel="apple-touch-startup-image"
          href="/splash-1179x2556.png"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 14 / 13 / 12 (390pt @3x = 1170×2532) -->
    <link rel="apple-touch-startup-image"
          href="/splash-1170x2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 13 mini / 12 mini / X / XS (375pt @3x = 1125×2436) -->
    <link rel="apple-touch-startup-image"
          href="/splash-1125x2436.png"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 14 Plus / 13 Pro Max / 12 Pro Max (428pt @3x = 1284×2778) -->
    <link rel="apple-touch-startup-image"
          href="/splash-1284x2778.png"
          media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone XR / 11 (414pt @2x = 828×1792) -->
    <link rel="apple-touch-startup-image"
          href="/splash-828x1792.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />

    <title>FinArch</title>
    <!-- Detect language & theme before first paint -->
    <script>
      (function(){
        var lang = localStorage.getItem('finarch-lang') || navigator.language || 'zh';
        var isEn = lang.indexOf('en') === 0;
        document.documentElement.lang = isEn ? 'en' : 'zh-CN';
        document.documentElement.dataset.mode = localStorage.getItem('finarch_mode') === 'life' ? 'life' : 'work';
        window.__splashTagline = isEn ? 'Ledger · Claims · Analysis' : '台账 · 报销 · 分析';
        // Dark-mode splash
        var theme = localStorage.getItem('finarch-theme') || 'system';
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#111815' : '#F3F6F2');
        window.__splashDark = dark;
      })();
    </script>
  </head>
  <body>
    <!-- First-paint ledger plate; removed by React after mount. -->
    <style>
      @keyframes splash-register-in {
        from { opacity:0; transform:translateY(6px); }
        to { opacity:1; transform:translateY(0); }
      }
      @keyframes splash-scan {
        from { transform:translateX(-100%); }
        to { transform:translateX(260%); }
      }
      #splash {
        position:fixed;inset:0;z-index:9999;
        display:flex;align-items:center;justify-content:center;
        background:#f3f6f2;color:#17201d;
        transition:opacity 0.36s ease;
      }
      .dark #splash { background:#111815;color:#dce4df; }
      #splash.splash-fade-out { opacity:0;pointer-events:none; }
      .splash-lockup {
        display:flex;flex-direction:column;align-items:center;gap:16px;
        animation:splash-register-in 0.42s ease-out both;
      }
      .splash-mark {
        width:96px;height:96px;overflow:hidden;border-radius:9px;
        box-shadow:0 12px 28px rgba(23,32,29,0.16);
      }
      .splash-brand {
        font-family:Georgia,'Songti SC',STSong,serif;
        font-size:24px;font-weight:700;letter-spacing:-0.03em;
      }
      .splash-tagline {
        color:#5b6b63;
        font-family:'Avenir Next',Avenir,'Segoe UI','PingFang SC',sans-serif;
        font-size:12px;font-weight:600;letter-spacing:0.08em;
      }
      .dark .splash-tagline { color:#97a79d; }
      .splash-progress {
        position:relative;width:72px;height:1px;overflow:hidden;
        background:#cbd5ce;margin-top:4px;
      }
      .dark .splash-progress { background:#34463e; }
      .splash-progress::after {
        position:absolute;inset:0;width:28px;background:#2d6687;
        content:'';animation:splash-scan 1.1s ease-in-out infinite;
      }
      @media (prefers-reduced-motion:reduce) {
        .splash-lockup,.splash-progress::after { animation:none; }
        #splash { transition-duration:0.01ms; }
        .splash-progress::after { transform:translateX(22px); }
      }
    </style>
    <div id="splash">
      <div class="splash-lockup">
        <div class="splash-mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="96" height="96">
            <rect width="200" height="200" rx="18" fill="#17201d"/>
            <path d="M38 34v130h130" fill="none" stroke="#cbd5ce" stroke-width="4" opacity=".72"/>
            <path d="M38 58h12M38 84h8M38 110h12M38 136h8" stroke="#cbd5ce" stroke-width="3" opacity=".8"/>
            <rect x="59" y="112" width="25" height="52" rx="3" fill="#2d6687"/>
            <rect x="99" y="82" width="25" height="82" rx="3" fill="#28745b"/>
            <rect x="139" y="49" width="25" height="115" rx="3" fill="#b95642"/>
            <path d="M59 103h25M99 73h25M139 40h25" stroke="#f3f6f2" stroke-width="3" opacity=".9"/>
          </svg>
        </div>
        <span class="splash-brand">FinArch</span>
        <span id="splash-tagline" class="splash-tagline"></span>
        <script>document.getElementById('splash-tagline').textContent=window.__splashTagline||'台账 · 报销 · 分析';</script>
        <div class="splash-progress" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
