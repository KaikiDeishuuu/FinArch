<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Keep legacy query-based action tokens out of same-origin asset logs and
         third-party font requests, including PWA navigation fallbacks. -->
    <meta name="referrer" content="no-referrer" />

    <!-- PWA 基础 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- 视口 & 移动端优化 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinArch" />

    <!-- Keep in sync with src/constants/theme.ts and vite.config.ts. -->
    <meta name="theme-color" content="#F6F7F9" />
    <meta name="msapplication-TileColor" content="#161A22" />

    <!-- SEO / 描述 -->
    <meta name="description" content="记账 · 报销 · 统计，轻量高效的多用户财务管理工具" />
    <meta name="application-name" content="FinArch" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
    />

    <!-- 禁止自动识别电话号码 -->
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS Apple Splash Screens -->
    <!-- iPhone 14 Pro / 15 Pro (393pt @3x = 1179×2556) -->
    <link rel="apple-touch-startup-image"
          href="/splash-1179x2556.png"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 14 / 13 / 12 (390pt @3x = 1170×2532) -->
    <link rel="apple-touch-startup-image"
          href="/splash-1170x2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 13 mini / 12 mini / X / XS (375pt @3x = 1125×2436) -->
    <link rel="apple-touch-startup-image"
          href="/splash-1125x2436.png"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 14 Plus / 13 Pro Max / 12 Pro Max (428pt @3x = 1284×2778) -->
    <link rel="apple-touch-startup-image"
          href="/splash-1284x2778.png"
          media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone XR / 11 (414pt @2x = 828×1792) -->
    <link rel="apple-touch-startup-image"
          href="/splash-828x1792.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />

    <title>FinArch</title>
    <!-- Detect language & theme before first paint -->
    <script>
      (function(){
        var lang = localStorage.getItem('finarch-lang') || navigator.language || 'zh';
        var isEn = lang.indexOf('en') === 0;
        document.documentElement.lang = isEn ? 'en' : 'zh-CN';
        window.__splashTagline = isEn ? 'Accounting · Reimbursement · Analytics' : '记账 · 报销 · 统计';
        // Dark-mode splash
        var theme = localStorage.getItem('finarch-theme') || 'system';
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        window.__splashDark = dark;
      })();
    </script>
  </head>
  <body>
    <!-- PWA splash screen: shown immediately, removed by React after mount -->
    <style>
      @keyframes splash-logo-in {
        0%   { opacity:0; transform:scale(0.96); }
        100% { opacity:1; transform:scale(1); }
      }
      @keyframes splash-bar-rise {
        0%   { transform:scaleY(0); opacity:0; }
        100% { transform:scaleY(1); opacity:1; }
      }
      @keyframes splash-text-in {
        0%   { opacity:0; transform:translateY(4px); }
        100% { opacity:1; transform:translateY(0); }
      }
      @keyframes splash-dots {
        0%,80%,100% { opacity:0.24; }
        40%         { opacity:0.9; }
      }
      #splash { transition:opacity 0.32s cubic-bezier(0.2,0,0,1); }
      #splash.splash-fade-out { opacity:0; pointer-events:none; }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
      }
    </style>
    <div id="splash" style="
      position:fixed;inset:0;z-index:9999;
      display:flex;align-items:center;justify-content:center;
      background:#F6F7F9;
    ">
      <script>if(window.__splashDark)document.getElementById('splash').style.background='#111318';</script>
      <div style="display:flex;flex-direction:column;align-items:center;gap:20px">
        <div style="
          width:104px;height:104px;border-radius:22px;
          background:#161A22;
          display:flex;align-items:center;justify-content:center;
          box-shadow:0 10px 28px rgba(17,19,24,0.18),0 1px 3px rgba(17,19,24,0.12);
          overflow:hidden;
          animation:splash-logo-in 0.36s cubic-bezier(0.2,0,0,1) both;
        ">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="80" height="80">
            <rect x="64"  y="272" width="112" height="144" rx="24" fill="#6B7A99"
                  style="transform-origin:center bottom;animation:splash-bar-rise 0.38s cubic-bezier(0.2,0,0,1) 0.12s both"/>
            <rect x="200" y="192" width="112" height="224" rx="24" fill="#3D6BE8"
                  style="transform-origin:center bottom;animation:splash-bar-rise 0.38s cubic-bezier(0.2,0,0,1) 0.20s both"/>
            <rect x="336" y="96"  width="112" height="320" rx="24" fill="#2FB37C"
                  style="transform-origin:center bottom;animation:splash-bar-rise 0.38s cubic-bezier(0.2,0,0,1) 0.28s both"/>
          </svg>
        </div>
        <span id="splash-brand" style="
          color:#161A22;font-family:'Geist','Noto Sans SC',ui-sans-serif,system-ui,sans-serif;
          font-size:22px;font-weight:650;letter-spacing:-0.02em;
          animation:splash-text-in 0.36s cubic-bezier(0.2,0,0,1) 0.2s both;
        ">FinArch</span>
        <script>if(window.__splashDark)document.getElementById('splash-brand').style.color='#E8EAEE';</script>
        <span id="splash-tagline" style="
          color:#5D6572;font-family:'Geist','Noto Sans SC',ui-sans-serif,system-ui,sans-serif;
          font-size:13px;
          animation:splash-text-in 0.36s cubic-bezier(0.2,0,0,1) 0.28s both;
        "></span>
        <script>
          var splashTagline=document.getElementById('splash-tagline');
          splashTagline.textContent=window.__splashTagline||'记账 · 报销 · 统计';
          if(window.__splashDark)splashTagline.style.color='#A3AAB6';
        </script>
        <div style="display:flex;gap:6px;margin-top:4px" aria-hidden="true">
          <div style="width:5px;height:5px;border-radius:50%;background:#6B7A99;animation:splash-dots 1.2s ease-in-out 0.5s infinite"></div>
          <div style="width:5px;height:5px;border-radius:50%;background:#3D6BE8;animation:splash-dots 1.2s ease-in-out 0.65s infinite"></div>
          <div style="width:5px;height:5px;border-radius:50%;background:#2FB37C;animation:splash-dots 1.2s ease-in-out 0.8s infinite"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
