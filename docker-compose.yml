services:
  init-permissions:
    image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    restart: "no"
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - finarch-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE

  api:
    image: ghcr.io/kaikideishuuu/finarch:${FINARCH_IMAGE_TAG:?FINARCH_IMAGE_TAG is required}
    container_name: finarch-api
    restart: unless-stopped
    # Give net/http enough time to drain in-flight requests before SIGKILL.
    stop_grace_period: ${FINARCH_HTTP_SHUTDOWN_TIMEOUT:-5m}
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - FINARCH_DB=/data/finarch.db
      - FINARCH_ADDR=0.0.0.0:8080
      - FINARCH_HTTP_READ_HEADER_TIMEOUT=${FINARCH_HTTP_READ_HEADER_TIMEOUT:-10s}
      - FINARCH_HTTP_READ_TIMEOUT=${FINARCH_HTTP_READ_TIMEOUT:-30m}
      - FINARCH_HTTP_WRITE_TIMEOUT=${FINARCH_HTTP_WRITE_TIMEOUT:-30m}
      - FINARCH_HTTP_IDLE_TIMEOUT=${FINARCH_HTTP_IDLE_TIMEOUT:-2m}
      - FINARCH_HTTP_SHUTDOWN_TIMEOUT=${FINARCH_HTTP_SHUTDOWN_TIMEOUT:-5m}
      - FINARCH_HTTP_MAX_HEADER_BYTES=${FINARCH_HTTP_MAX_HEADER_BYTES:-65536}
      # System operations are server-side only. Never expose the secret to browser code.
      - FINARCH_ENABLE_SYSTEM_OPERATIONS=${FINARCH_ENABLE_SYSTEM_OPERATIONS:-false}
      - FINARCH_SYSTEM_OPERATIONS_SECRET=${FINARCH_SYSTEM_OPERATIONS_SECRET:-}
      # Compose is a reverse-proxy deployment. Supply the exact direct proxy and
      # every controlled intermediary in the trusted XFF suffix; /0 is rejected.
      - FINARCH_BEHIND_PROXY=true
      - FINARCH_TRUSTED_PROXY_CIDRS=${FINARCH_TRUSTED_PROXY_CIDRS:?FINARCH_TRUSTED_PROXY_CIDRS is required for Docker Compose}
      - FINARCH_CORS_ALLOWED_ORIGINS=${FINARCH_CORS_ALLOWED_ORIGINS:-}
      - FINARCH_ATTACHMENTS_DIR=/data/attachments
      - FINARCH_ATTACHMENT_MAX_BYTES=${FINARCH_ATTACHMENT_MAX_BYTES:-20971520}
      - FINARCH_ATTACHMENT_MAX_FILES_PER_USER=${FINARCH_ATTACHMENT_MAX_FILES_PER_USER:-500}
      - FINARCH_ATTACHMENT_MAX_TOTAL_BYTES_PER_USER=${FINARCH_ATTACHMENT_MAX_TOTAL_BYTES_PER_USER:-1073741824}
      - FINARCH_ATTACHMENT_UPLOADS_PER_MINUTE=${FINARCH_ATTACHMENT_UPLOADS_PER_MINUTE:-30}
      - FINARCH_ATTACHMENT_ORPHAN_TTL=${FINARCH_ATTACHMENT_ORPHAN_TTL:-24h}
      - FINARCH_ATTACHMENT_ORPHAN_CLEANUP_INTERVAL=${FINARCH_ATTACHMENT_ORPHAN_CLEANUP_INTERVAL:-1h}
      - FINARCH_ATTACHMENT_ORPHAN_CLEANUP_BATCH_SIZE=${FINARCH_ATTACHMENT_ORPHAN_CLEANUP_BATCH_SIZE:-100}
      - FINARCH_RECURRING_AUTORUN=${FINARCH_RECURRING_AUTORUN:-true}
      - FINARCH_RECURRING_INTERVAL=${FINARCH_RECURRING_INTERVAL:-15m}
      - FINARCH_RECURRING_BATCH_LIMIT=${FINARCH_RECURRING_BATCH_LIMIT:-100}
      - FINARCH_RECURRING_DRY_RUN=${FINARCH_RECURRING_DRY_RUN:-false}
      - FINARCH_OCR_PROVIDER=${FINARCH_OCR_PROVIDER:-none}
      - FINARCH_OCR_URL=${FINARCH_OCR_URL:-http://ocr:8000/ocr}
      - FINARCH_OCR_TIMEOUT=${FINARCH_OCR_TIMEOUT:-45s}
      - FINARCH_OCR_LANG=${FINARCH_OCR_LANG:-ch}
      - FINARCH_OCR_AISTUDIO_TOKEN=${FINARCH_OCR_AISTUDIO_TOKEN:-}
      - FINARCH_OCR_AISTUDIO_MODEL=${FINARCH_OCR_AISTUDIO_MODEL:-}
      - FINARCH_OCR_AISTUDIO_JOB_URL=${FINARCH_OCR_AISTUDIO_JOB_URL:-https://paddleocr.aistudio-app.com/api/v2/ocr/jobs}
      - FINARCH_OCR_AISTUDIO_OPTIONAL_PAYLOAD=${FINARCH_OCR_AISTUDIO_OPTIONAL_PAYLOAD:-}
      - FINARCH_OCR_AISTUDIO_POLL_INTERVAL=${FINARCH_OCR_AISTUDIO_POLL_INTERVAL:-2s}
      - FINARCH_OCR_AISTUDIO_MAX_RESULT_BYTES=${FINARCH_OCR_AISTUDIO_MAX_RESULT_BYTES:-10485760}
      - FINARCH_OCR_AISTUDIO_ALLOWED_RESULT_HOSTS=${FINARCH_OCR_AISTUDIO_ALLOWED_RESULT_HOSTS:-}
      - FINARCH_OCR_MAX_CONCURRENT_PER_USER=${FINARCH_OCR_MAX_CONCURRENT_PER_USER:-1}
      - FINARCH_OCR_MAX_CONCURRENT_GLOBAL=${FINARCH_OCR_MAX_CONCURRENT_GLOBAL:-4}
      - FINARCH_OCR_MAX_RUNS_PER_HOUR=${FINARCH_OCR_MAX_RUNS_PER_HOUR:-20}
      - GIN_MODE=release
      # Cloudflare Turnstile CAPTCHA (leave empty to disable for local dev)
      # Get keys at https://dash.cloudflare.com/?to=/:account/turnstile
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      # Email verification & password reset (Resend API, leave empty to disable)
      # Get API key at https://resend.com — set RESEND_API_KEY to enable
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      # App base URL used in email links (defaults to https://farc.dev)
      - APP_BASE_URL=${APP_BASE_URL:-}
      - LITESTREAM_STATUS_FILE=${LITESTREAM_STATUS_FILE:-/data/litestream_status.json}
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET:-}
      - LITESTREAM_ENDPOINT=${LITESTREAM_ENDPOINT:-}
    volumes:
      - finarch-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # One 100 MiB restore upload can coexist with up to 200 MiB of extracted data.
      # Keep maintenance restores serialized; increase this explicitly before concurrent restores.
      - /tmp:size=${FINARCH_TMPFS_SIZE:-512m},mode=1777
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Litestream 实时备份 sidecar（可选，需要 Cloudflare R2 凭据）
  # 启用方式：docker compose --profile backup up -d
  litestream:
    image: litestream/litestream:0.3.13@sha256:027eda2a89a86015b9797d2129d4dd447e8953097b4190e1d5a30b73e76d8d58
    container_name: finarch-litestream
    restart: unless-stopped
    user: "10001:10001"
    command: ["replicate", "-config", "/etc/litestream.yml"]
    volumes:
      - finarch-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
      - ./scripts/litestream-healthcheck.sh:/usr/local/bin/litestream-healthcheck.sh:ro
    environment:
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET:-}
      - LITESTREAM_ENDPOINT=${LITESTREAM_ENDPOINT:-}
      - LITESTREAM_STATUS_FILE=${LITESTREAM_STATUS_FILE:-/data/litestream_status.json}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "sh /usr/local/bin/litestream-healthcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      - api
    profiles:
      - backup

volumes:
  finarch-data:
    driver: local
