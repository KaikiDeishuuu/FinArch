name: Build & Publish to GHCR

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kaikideishuuu/finarch
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-and-push:
    name: Build image & push to GHCR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Reject stale workflow runs
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$COMMIT_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ env.COMMIT_SHA }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
          sbom: true
          provenance: true

      - name: Reject commit superseded during build
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$COMMIT_SHA"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ~/FinArch
            git fetch origin main
            git switch main
            git merge --ff-only ${{ env.COMMIT_SHA }}
            test "$(git rev-parse HEAD)" = "${{ env.COMMIT_SHA }}"
            if grep -q '^FINARCH_IMAGE_TAG=' .env; then
              sed -i 's/^FINARCH_IMAGE_TAG=.*/FINARCH_IMAGE_TAG=sha-${{ env.COMMIT_SHA }}/' .env
            else
              printf '\nFINARCH_IMAGE_TAG=sha-${{ env.COMMIT_SHA }}\n' >> .env
            fi
            docker compose pull api
            docker compose run --rm init-permissions
            docker compose up -d --wait --wait-timeout 180 api
            echo "✅ Deploy finished at $(date)"

      - name: Confirm deployed commit is still current
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$COMMIT_SHA"

      - name: Promote immutable image to latest
        run: >-
          docker buildx imagetools create
          --tag "$REGISTRY/$IMAGE_NAME:latest"
          "$REGISTRY/$IMAGE_NAME:sha-$COMMIT_SHA"
